<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grade 7 English Games</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14205a;--panel:#1e2d7d;--paper:#fffdf7;--ink:#14205a;--sun:#ffc93c;--mute:#b9c3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1540;--panel:#17236b;--paper:#f3f0e6}}
:root[data-theme="dark"]{--bg:#0d1540;--panel:#17236b;--paper:#f3f0e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Nunito,system-ui,"Segoe UI",Arial,sans-serif;font-weight:600;min-height:100vh;
background-image:radial-gradient(circle at 12% 8%,rgba(255,255,255,.18) 0 2px,transparent 3px),radial-gradient(circle at 78% 14%,rgba(255,255,255,.14) 0 2px,transparent 3px);background-size:260px 200px}
main{max-width:760px;margin:0 auto;padding:28px 16px 36px}
h1,h2{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;margin:0}
h1{font-size:2.2rem;color:var(--sun);line-height:1.05;text-align:center}
.sub{text-align:center;color:var(--mute);margin:8px 0 26px;line-height:1.5}
.list{display:grid;gap:18px}
@media (min-width:640px){.list{grid-template-columns:1fr 1fr}}
a.card{display:block;background:var(--paper);color:var(--ink);border-radius:16px;text-decoration:none;box-shadow:0 6px 0 rgba(0,0,0,.25);position:relative}
a.card:hover{transform:translateY(-2px)}
a.card:focus-visible{outline:3px solid #fff;outline-offset:3px}
.pic{aspect-ratio:16/9;border-radius:16px 16px 0 0;overflow:hidden}
.pic svg{width:100%;height:100%;display:block}
.stub{position:relative;border-top:2px dashed #c9c2a8;padding:14px 16px 16px}
.stub::before,.stub::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.stub::before{left:-9px}.stub::after{right:-9px}
.stub h2{font-size:1.35rem}
.stub p{margin:4px 0 12px;color:#46508f;line-height:1.4}
.go{display:inline-block;background:var(--sun);color:var(--ink);font-family:"Baloo 2",sans-serif;font-weight:800;border-radius:999px;padding:6px 20px;box-shadow:0 3px 0 #c99a14}
footer{text-align:center;color:var(--mute);margin-top:30px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Grade 7 English Games</h1>
  <p class="sub">Unit 1 · Lesson 5<br>Choose a game and start playing!</p>
  <div class="list">
    <a class="card" href="lesson5-part1/">
      <div class="pic"><svg viewBox="0 0 120 68" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="120" height="68" fill="#1c6fb8"/><rect y="48" width="120" height="20" fill="#14518a"/><path d="M58 30q22-22 44 0q-22 22-44 0z" fill="#ff8a3d"/><path d="M100 30l14-12v24z" fill="#ff8a3d"/><circle cx="70" cy="27" r="3" fill="#fff"/><circle cx="71" cy="27" r="1.4" fill="#000"/><path d="M16 44q18-14 36 0q-18 14-36 0z" fill="#ffd23f"/><path d="M50 44l10-8v16z" fill="#ffd23f"/><g fill="#7fe0ff" opacity=".7"><circle cx="20" cy="14" r="4"/><circle cx="30" cy="26" r="2.5"/></g></svg></div>
      <div class="stub"><h2>Fun Day Out Quest</h2><p>Places of entertainment and the Present continuous for future plans.</p><span class="go">Play</span></div>
    </a>
    <a class="card" href="lesson5-part2/">
      <div class="pic"><svg viewBox="0 0 120 68" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="120" height="68" fill="#D6F0E6"/><path d="M50 4h20v6h-3v20l22 34q3 8-6 8H37q-9 0-6-8l22-34V10h-3z" fill="#fff" stroke="#2d6a5a" stroke-width="3" stroke-linejoin="round"/><path d="M42 44h36l10 16q2 4-4 4H36q-6 0-4-4z" fill="#3ddc84"/><g fill="none" stroke="#ff8a3d" stroke-width="2"><ellipse cx="100" cy="16" rx="12" ry="5"/><ellipse cx="100" cy="16" rx="12" ry="5" transform="rotate(60 100 16)"/><ellipse cx="100" cy="16" rx="12" ry="5" transform="rotate(120 100 16)"/></g></svg></div>
      <div class="stub"><h2>Saturday Plans Quest</h2><p>Solve the clues, listen and write your plans for next Saturday.</p><span class="go">Play</span></div>
    </a>
  </div>
  <footer>Created by T.Badria Alfalahi</footer>
</main>
</body>
</html>
